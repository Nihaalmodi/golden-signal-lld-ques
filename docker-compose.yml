version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: golden-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: golden
    ports:
      - "5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - golden_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d golden"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./app
    container_name: shop-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/golden
      DB_POOL_MIN: "2"
      DB_POOL_MAX: "6"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  loadgen:
    build: ./loadgen
    container_name: loadgen
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    depends_on:
      - api

volumes:
  golden_db_data:
